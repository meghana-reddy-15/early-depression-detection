
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>DepressionDetect</title>

    <!-- Bootstrap CSS -->
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-inverse">
    <div class="container">
        <div class="navbar-header">
          <a class="navbar-brand" href="/donate">DepressionDetect</a>
        </div>
        <ul class="nav navbar-nav">
    <li class="active"><a href="/donate">Analyze</a></li>
</ul>
        </ul>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container">
    <div class="row">
        <div class="col-md-8 col-md-offset-2 box">

            <h2 class="text-center">Depression Detection</h2>
            <p class="text-center">
                Analyze your mental state using <b>Text, Image, and Audio</b>.
            </p>

            <hr>

            <!-- FORM -->
            <form action="/donate" method="post" enctype="multipart/form-data">

                <!-- TEXT -->
                <div class="form-group">
                    <label><b>Enter your thoughts:</b></label>
                    <textarea name="user_text" class="form-control"
                              rows="4"
                              placeholder="Type how you feel..."></textarea>
                </div>

                <br>

                <!-- IMAGE -->
                <div class="form-group">
                    <label><b>Upload Image (jpg/png):</b></label>
                    <input type="file" name="image" class="form-control" accept=".jpg,.jpeg,.png">
                </div>

                <br>

                <!-- AUDIO -->
                <div class="form-group">
                    <label><b>Upload Audio (.wav):</b></label>
                    <input type="file" name="file" class="form-control" accept=".wav">
                </div>

                <br>

                <!-- SUBMIT -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Analyze
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<br><br>


<!-- JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>

</body>
</html>
